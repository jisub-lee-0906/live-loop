[project]
name = "live-loop"
version = "0.1.0"
description = "Free, local-first AI live-loop performance instrument"
license = "MIT"
authors = [
    { name = "jisub-lee-0906", email = "jisub0906@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "python-osc>=1.10.2",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.47.0",
]

[project.scripts]
live-loop = "live_loop:main"
live-loop-api = "live_loop.api_server:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python>=0.3.23",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
